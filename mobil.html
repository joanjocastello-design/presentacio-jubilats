<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8e2136">
<title>Jubilats de Castelló · Presentació per a mòbil</title>
<style>
:root{--wine:#8e2136;--gold:#b78b42}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Arial,sans-serif;background:#f4f1f0;color:#282329}
body{display:flex;flex-direction:column;min-height:100dvh}.top{padding:12px 18px;background:#fff;border-bottom:3px solid var(--gold);display:flex;gap:10px;align-items:center;justify-content:space-between}.top strong{font-size:16px}.top small{display:block;font-size:12px;color:#6c6265;font-weight:400}.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;touch-action:pan-y}.stage{width:min(100%,calc((100dvh - 165px)*16/9));aspect-ratio:16/9;background:white;box-shadow:0 4px 26px #0002;overflow:hidden;position:relative}.stage iframe{width:100%;height:100%;display:block;border:0}
.bar{background:#fff;border-top:1px solid #ded7d8;padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:13px}.bar button,.top button{border:1px solid #d7cbd0;background:#fff;color:var(--wine);border-radius:12px;min-height:44px;font:700 16px system-ui;cursor:pointer}.bar button{min-width:70px}.bar button:disabled{opacity:.3}.bar .counter{font-variant-numeric:tabular-nums;min-width:83px;text-align:center;font-weight:700}.top button{padding:0 12px;font-size:13px}.hint{font-size:12px;text-align:center;color:#706469;padding:0 8px 8px;background:#fff}.error{position:absolute;inset:0;display:none;place-items:center;background:white;padding:20px;text-align:center;font-size:14px}
@media (orientation:landscape) and (max-height:600px){.top{padding:5px 12px}.top small,.hint{display:none}.stage-wrap{padding:3px}.stage{width:min(100%,calc((100dvh - 108px)*16/9))}.bar{padding:4px 8px max(5px,env(safe-area-inset-bottom))}.bar button{min-height:34px}}
</style>
</head>
<body>
<header class="top"><div><strong>Jubilats de Castelló</strong><small>Estatuts 2026 · Presentació tàctil</small></div><button id="wide" type="button">Pantalla completa</button></header>
<main class="stage-wrap"><div class="stage" id="stage"><iframe id="presentation" title="Presentació dels estatuts de Jubilats de Castelló" src="./index.html#1" loading="eager"></iframe><div class="error" id="err">No es pot carregar la presentació. Puja <strong>mobil.html</strong> en el mateix repositori que <strong>index.html</strong>.</div></div></main>
<footer><div class="bar"><button id="prev" type="button" aria-label="Anterior">‹ Anterior</button><span class="counter" id="counter">01 / 31</span><button id="next" type="button" aria-label="Següent">Següent ›</button></div><div class="hint">Llisca el dit cap a l'esquerra o la dreta per canviar de diapositiva · Gira el mòbil per veure-les més grans</div></footer>
<script>
(()=>{
 const f=document.getElementById('presentation'),count=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');
 let doc=null,total=31,current=1;
 function refresh(){if(!doc)return;const slides=[...doc.querySelectorAll('.slide')];if(slides.length)total=slides.length;let active=slides.findIndex(s=>s.classList.contains('active'));if(active>=0)current=active+1;count.textContent=String(current).padStart(2,'0')+' / '+total;prev.disabled=current===1;next.disabled=current===total;}
 function goto(n){if(!doc)return;const dest=Math.max(1,Math.min(total,n));const curr=doc.querySelector('.slide.active');if(dest===current&&curr)return;const id=dest>current?'next':'prev';const steps=Math.abs(dest-current);for(let i=0;i<steps;i++){const b=doc.getElementById(id);if(b)b.click()}current=dest;refresh();}
 f.addEventListener('load',()=>{try{doc=f.contentDocument;if(!doc || !doc.querySelector('.slide'))throw Error('No slides');const style=doc.createElement('style');style.textContent='#controls,#progress{display:none!important}';doc.head.appendChild(style);refresh();const slides=doc.querySelectorAll('.slide');const ob=new MutationObserver(refresh);slides.forEach(s=>ob.observe(s,{attributes:true,attributeFilter:['class']}));doc.addEventListener('touchend',()=>setTimeout(refresh,30),{passive:true});doc.addEventListener('keydown',()=>setTimeout(refresh,30));}catch(e){document.getElementById('err').style.display='grid'}});
 prev.addEventListener('click',()=>goto(current-1));next.addEventListener('click',()=>goto(current+1));
 let startX=null;const wrap=document.getElementById('stage');wrap.addEventListener('touchstart',e=>{if(e.touches.length===1)startX=e.touches[0].clientX},{passive:true});wrap.addEventListener('touchend',e=>{if(startX==null)return;let dx=e.changedTouches[0].clientX-startX;startX=null;if(Math.abs(dx)>55){goto(current+(dx<0?1:-1))}},{passive:true});
 document.getElementById('wide').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.()}});
})();
</script>
</body>
</html>
